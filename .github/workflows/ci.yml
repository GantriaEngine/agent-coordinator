name: coordination
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  control:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python examples/simulation.py
      - run: python tools/check.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: git diff --check
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - if: runner.os == 'Windows'
        run: dotnet publish privileged-helper/AgentCoordinator.CaptureService.csproj -c Release -r win-x64 --self-contained false -m:2 -o privileged-helper/publish
      - if: runner.os == 'Windows'
        run: dotnet run --project tests/helper/HelperTests.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*
            privileged-helper/publish/*
