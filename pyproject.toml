[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gantria-agent-coordinator"
version = "0.1.0"
description = "Bounded multi-agent coordination with locally approved capabilities"
requires-python = ">=3.12"
license = {file = "LICENSE"}

[tool.setuptools]
packages = ["agent_coordinator"]

[tool.setuptools.package-data]
agent_coordinator = ["schemas/*.json"]
